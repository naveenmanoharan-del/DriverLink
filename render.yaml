# Render Blueprint — provisions the API and the website from this repo.
#
# In Render: New -> Blueprint -> pick this repository. Render reads this file
# and creates both services. You only supply DATABASE_URL (see below); the JWT
# secrets are generated by Render so no real secret is ever committed here.
#
# Postgres is NOT defined here on purpose. Render's own free database is deleted
# 30 days after creation, so the database lives on Supabase instead and is
# supplied as DATABASE_URL.
#
# Free plan caveat: services sleep after 15 minutes idle and take ~30-50s to
# wake on the next request.

services:
  # ---------------------------------------------------------------------
  # NestJS API  ->  https://yukti-api.onrender.com/api
  # ---------------------------------------------------------------------
  - type: web
    name: yukti-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Paste the Supabase connection string here in the Render dashboard.
      # Use the session pooler / direct connection (port 5432) — the transaction
      # pooler on 6543 breaks migrations.
      - key: DATABASE_URL
        sync: false
      # Render generates these once and keeps them stable across deploys.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # Full origin of the website, e.g. https://yukti-web.onrender.com
      # (comma-separated if there is more than one). Render's `fromService`
      # would yield a bare hostname with no scheme, which never matches the
      # browser's Origin header — so this is set by hand after the first deploy.
      - key: CORS_ORIGIN
        sync: false
      - key: REQUEST_LOGGING
        value: "false"
      - key: RATE_LIMIT_TTL_MS
        value: "60000"
      - key: RATE_LIMIT_LIMIT
        value: "60"

  # ---------------------------------------------------------------------
  # Next.js website  ->  https://yukti-web.onrender.com
  # ---------------------------------------------------------------------
  - type: web
    name: yukti-web
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Full API base URL including scheme and the /api prefix, e.g.
      # https://yukti-api.onrender.com/api
      # This is baked into the client bundle at build time, so after changing it
      # the web service must be redeployed, not just restarted.
      - key: NEXT_PUBLIC_API_URL
        sync: false
