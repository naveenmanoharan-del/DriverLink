# One domain serves both apps: /api goes to the NestJS API, everything else to
# Next.js. setup.sh substitutes __DOMAIN__; certbot later adds the HTTPS block
# and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Resumes are capped at 5 MB by the API; leave headroom for the form fields.
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3001;
    }
}
